<style>
/* 电子书样式：与 pdf-style.html 共用字体、配色和引用块语言，
   但去掉 @page、mm 尺寸等只对打印有意义的规则。 */
body {
  font-family: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", serif;
  line-height: 1.7;
  color: #2b2f36;
}

h1, h2, h3, h4 { color: #17324d; line-height: 1.3; page-break-after: avoid; }
h1 {
  font-size: 1.8em;
  margin: 0 0 0.8em 0;
  padding-bottom: 0.3em;
  border-bottom: 2px solid #2f6fb2;
}
h2 {
  font-size: 1.4em;
  margin: 1.2em 0 0.5em 0;
  padding-bottom: 0.2em;
  border-bottom: 1px solid #d3dde8;
}
h3 { font-size: 1.2em; margin: 1em 0 0.4em 0; }
h4 { font-size: 1.05em; margin: 0.9em 0 0.3em 0; }

p { margin: 0 0 1em 0; }
ul, ol { margin: 0.6em 0 1em 0; padding-left: 1.5em; }
li { margin: 0.15em 0; }

blockquote {
  margin: 0.8em 0 1em 0;
  padding: 0.2em 0 0.2em 1em;
  border-left: 3px solid #2f6fb2;
  color: #374151;
}
blockquote p { margin: 0.2em 0; }

img { max-width: 100%; height: auto; }
p > img { display: block; margin: 0.8em auto; }

table { border-collapse: collapse; width: 100%; margin: 0.8em 0; }
th, td { border: 1px solid #c3cdd8; padding: 0.3em 0.5em; vertical-align: top; }
th { background: #eef3f8; font-weight: bold; }
</style>
